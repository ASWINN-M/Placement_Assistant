name: Placement worker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/placement-worker.yml"

jobs:
  run-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show commit being used
        working-directory: .
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "SHA=${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Write secrets into Backend/
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          CALENDAR_TOKEN_JSON: ${{ secrets.CALENDAR_TOKEN_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${GROQ_API_KEY}" ] || [ -z "${DATABASE_URL}" ]; then
            echo "Missing GROQ_API_KEY or DATABASE_URL secret."
            exit 1
          fi

          if [ -z "${GMAIL_CREDENTIALS_JSON}" ] || [ -z "${GMAIL_TOKEN_JSON}" ] || [ -z "${CALENDAR_TOKEN_JSON}" ]; then
            echo "Missing Gmail/Calendar JSON secrets."
            exit 1
          fi

          {
            echo "GROQ_API_KEY=${GROQ_API_KEY}"
            echo "DATABASE_URL=${DATABASE_URL}"
          } > .env

          printf '%s\n' "${GMAIL_CREDENTIALS_JSON}" > credentials.json
          printf '%s\n' "${GMAIL_TOKEN_JSON}" > token.json
          printf '%s\n' "${CALENDAR_TOKEN_JSON}" > calendar_token.json

      - name: Run placement worker
        env:
          GITHUB_ACTIONS: "true"
          CI: "true"
        run: python gmail_services.py
